name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno fmt --check
      - run: deno lint
      - name: Type-check
        env:
          BOT_TOKEN: "1:ci"
          BOT_OWNER_ID: "1"
          TELEGRAM_WEBHOOK_SECRET: "ci-webhook-secret-0123456789-abcdefghijk"
          STORAGE_CHANNEL_ID: "-1001"
          MINI_APP_URL: "https://ci.example"
          SUPABASE_URL: "https://ci.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "ci"
          SESSION_SECRET: "ci-session-secret-0123456789-abcdefghijklmnop"
        run: deno task check
      - run: deno task test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
      
