name: Bug report
description: Something is not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. A clear report gets fixed faster.
        **Never paste tokens, keys, secrets or your `.env` file.** Remove them from logs before posting.
  - type: input
    id: version
    attributes:
      label: Version
      description: "Shown in Settings > Live status (\"This app\" / \"Backend\") or in `deno.json`."
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does the problem happen?
      options:
        - Mini App (screens and buttons)
        - Telegram bot (commands, saving files)
        - Backend / API
        - Database / SQL
        - Deployment (Vercel, Deno Deploy, webhook)
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
      placeholder: "When I tap Share on a file, nothing happens. I expected a link dialog."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where are you using it?
      multiple: true
      options:
        - Telegram on Android
        - Telegram on iPhone / iPad
        - Telegram Desktop
        - Telegram Web
        - Normal web browser
    validations:
      required: false
  - type: textarea
    id: status
    attributes:
      label: Live status
      description: Open Settings > Live status and tell us which rows do not say OK (copy the text next to them).
      render: text
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Deno Deploy logs, browser console errors, or screenshots. Remove any secrets first.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and could not find this problem.
          required: true
        - label: I removed all tokens, keys and secrets from this report.
          required: true
